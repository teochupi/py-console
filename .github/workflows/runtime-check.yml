name: Validate iOS Python runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runtime-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install pyodide@0.28.3 --save-exact
      - name: Runtime lock metadata
        run: node -e 'console.log("RUNTIME_METADATA="+JSON.stringify(JSON.parse(require("fs").readFileSync("package-lock.json","utf8")).packages["node_modules/pyodide"]))'
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
