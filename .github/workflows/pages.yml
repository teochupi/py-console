name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check author website connectivity
        continue-on-error: true
        run: curl --location --head --fail --max-time 30 https://teodor-chupetlov.eu/
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: Diagnose current published app
        continue-on-error: true
        env:
          PUBLISHED_URL: https://teochupi.github.io/py-console/
        run: npx playwright test e2e/published.spec.js --project=chromium
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published app
        env:
          PUBLISHED_URL: https://teochupi.github.io/py-console/
        run: npx playwright test e2e/published.spec.js
